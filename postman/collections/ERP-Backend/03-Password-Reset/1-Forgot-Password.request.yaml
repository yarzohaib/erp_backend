$kind: http-request
name: 1. Forgot Password
order: 10000
method: POST
url: '{{baseUrl}}/api/v1/auth/forgot-password'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      console.log("Check backend terminal output for PASSWORD RESET URL and token!");
