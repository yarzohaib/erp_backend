$kind: http-request
name: 2. Revoke Session by ID
order: 9000
method: DELETE
url: '{{baseUrl}}/api/v1/auth/sessions/{{sessionId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Session revoked", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.message).to.eql("Session revoked successfully");
      });
